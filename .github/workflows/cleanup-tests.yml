name: Cleanup old test folders

# One-shot cleanup: removes the old test folders from code/ in a single
# commit. It runs once, when this file itself is pushed, and deletes this
# file in the same commit. A later trigger exits because the folders are
# already gone.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-tests.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Remove the old test folders
        run: |
          if [ ! -d code/game/game/tests ]; then
            echo "The old test folders are already gone."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rq code/qcommon/tests \
                     code/game/game/tests \
                     code/game/cgame/tests \
                     code/game/ui/tests \
                     code/renderer/tests \
                     code/sound/tests \
                     code/tools/editor/tests \
                     code/tools/compilers/dmap/tests
          git rm -q .github/workflows/cleanup-tests.yml
          git commit -m "Remove the old test folders from code"
          git push
