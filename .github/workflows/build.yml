name: Build

# Compiles the project and saves build.log as an artifact for every platform.
# Only the Windows x86 build compiles today: the game module ABI is still
# 32-bit (task 12 opens the 64-bit builds) and the build needs the MSVC tools
# (other systems are task 12). The other jobs write a short note instead.

on:
  push:
    branches: [main]
    # Changing only the logs does not need a new build.
    paths-ignore:
      - 'build.log'
      - 'build-digest.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        arch: [x86, x64]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: python -m pip install scons

      - name: Set up MSVC (Windows x86)
        if: runner.os == 'Windows' && matrix.arch == 'x86'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Make sure clang-cl exists (Windows x86)
        if: runner.os == 'Windows' && matrix.arch == 'x86'
        shell: pwsh
        run: |
          if (-not (Get-Command clang-cl -ErrorAction SilentlyContinue)) {
            choco install llvm -y --no-progress
          }
          clang-cl --version

      - name: Build (Windows x86)
        if: runner.os == 'Windows' && matrix.arch == 'x86'
        shell: bash
        run: |
          set -o pipefail
          JOBS=$(nproc 2>/dev/null || echo 2)
          scons -j "$JOBS" 2>&1 | tee build.log

      - name: Run the tests (Windows x86)
        # Building the tests stays optional for a local build, but the CI
        # run always builds and runs them.
        if: runner.os == 'Windows' && matrix.arch == 'x86'
        shell: bash
        run: |
          set -o pipefail
          JOBS=$(nproc 2>/dev/null || echo 2)
          scons test -j "$JOBS" 2>&1 | tee test.log

      - name: Report the build errors
        # The full build log is only in the artifact, so the errors are
        # copied into the job summary where they can be read on the run
        # page without downloading anything.
        if: failure(
) && runner.os == 'Windows' && matrix.arch == 'x86'
        shell: bash
        run: |
          {
            echo '### Build errors'
            echo ''
            echo '```'
            grep -i -E 'error|scons: ***' build.log | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the build log
        # The build log is committed to the repository root, the same
        # place a manual build keeps it, whether the build passed or
        # failed. The digest workflow then runs when this Build run
        # finishes, writes build-digest.md and lets the log be read
        # without downloading the artifact.
        if: ${{ !cancelled() && runner.os == 'Windows' && matrix.arch == 'x86' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.log
          if git diff --cached --quiet; then
            echo "build.log did not change."
          else
            git commit -m "Save the Windows x86 build log"
            git push
          fi

      - name: Not built on this platform
        if: ${{ !(runner.os == 'Windows' && matrix.arch == 'x86') }}
        shell: bash
        run: |
          if [ "${{ runner.os }}" != "Windows" ]; then
            {
              echo "This platform does not build yet."
              echo "The port builds on Windows only for now, see task 12 in TODO.md."
            } | tee build.log
          else
            {
              echo "This platform does not build yet."
              echo "Only 32-bit builds work right now, the game module ABI is"
              echo "still 32-bit. Task 12 in TODO.md opens the 64-bit builds."
            } | tee build.log
          fi

      - name: Save build.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}-${{ matrix.arch }}
          path
: build.log
          if-no-files-found: ignore
