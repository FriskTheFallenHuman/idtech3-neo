name: Build

# Compiles the project and saves build.log as an artifact for every platform.
# Only the Windows x86 build compiles today: the old bytecode VM locks the
# port to 32-bit (task 2 removes it) and the build needs the MSVC tools
# (other systems are task 4). The other jobs write a short note instead.

on:
  push:
    branches: [main]
    # Changing only the logs does not need a new build.
    paths-ignore:
      - 'build.log'
      - 'build-digest.md'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        arch: [x86, x64]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: python -m pip install scons

      - name: Set up MSVC (Windows x86)
        if: runner.os == 'Windows' && matrix.arch == 'x86'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Make sure clang-cl exists (Windows x86)
        if: runner.os == 'Windows' && matrix.arch == 'x86'
        shell: pwsh
        run: |
          if (-not (Get-Command clang-cl -ErrorAction SilentlyContinue)) {
            choco install llvm -y --no-progress
          }
          clang-cl --version

      - name: Build (Windows x86)
        if: runner.os == 'Windows' && matrix.arch == 'x86'
        shell: bash
        run: |
          set -o pipefail
          JOBS=$(nproc 2>/dev/null || echo 2)
          scons -j "$JOBS" 2>&1 | tee build.log

      - name: Not built on this platform
        if: ${{ !(runner.os == 'Windows' && matrix.arch == 'x86') }}
        shell: bash
        run: |
          if [ "${{ runner.os }}" != "Windows" ]; then
            {
              echo "This platform does not build yet."
              echo "The port builds on Windows only for now, see task 4 in TODO.md."
            } | tee build.log
          else
            {
              echo "This platform does not build yet."
              echo "Only 32-bit builds work right now, the old bytecode VM locks the"
              echo "port to x86. Task 2 in TODO.md removes the VM."
            } | tee build.log
          fi

      - name: Save build.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}-${{ matrix.arch }}
          path: build.log
          if-no-files-found: ignore
